name: 出处截图

on:
  workflow_dispatch:
    inputs:
      force:
        description: 重新抓取所有出处（否则只抓新增与上次失败的）
        type: boolean
        default: false
  schedule:
    - cron: '0 3 1 * *'   # 每月 1 日 UTC 03:00 补抓失败项

permissions:
  contents: write

concurrency:
  group: shots
  cancel-in-progress: false

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装 Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium
      - name: 抓取截图
        run: node scripts/shots.mjs ${{ inputs.force && '--force' || '' }}
      - name: 提交回仓库
        run: |
          rm -rf node_modules package.json package-lock.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shots
          git diff --cached --quiet && echo "无变化" && exit 0
          git commit -m "shots: 更新出处截图（$(date -u +%F)）"
          git push
